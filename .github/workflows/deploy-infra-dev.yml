name: Deploy Infrastructure (Dev)

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: dev

jobs:
  load-config:
    name: Load Environment Config
    runs-on: ubuntu-latest
    outputs:
      resource_group: ${{ steps.config.outputs.resource_group }}
      location: ${{ steps.config.outputs.location }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read environment config
        id: config
        run: |
          RESOURCE_GROUP=$(jq -r '.dev.resourceGroupName' infra/environments.json)
          LOCATION=$(jq -r '.dev.location' infra/environments.json)
          echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "location=$LOCATION" >> $GITHUB_OUTPUT

  validate:
    name: Validate Bicep
    needs: load-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group validate \
              --resource-group ${{ needs.load-config.outputs.resource_group }} \
              --template-file infra/main.bicep \
              --parameters infra/parameters/dev.bicepparam

  what-if:
    name: What-If Preview
    needs: [load-config, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-If
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group ${{ needs.load-config.outputs.resource_group }} \
              --template-file infra/main.bicep \
              --parameters infra/parameters/dev.bicepparam

  deploy:
    name: Deploy to Dev
    needs: [load-config, what-if]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ needs.load-config.outputs.resource_group }} \
              --template-file infra/main.bicep \
              --parameters infra/parameters/dev.bicepparam \
              --name "infra-dev-${{ github.run_number }}"

      - name: Capture Outputs
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "## Deployment Outputs" >> $GITHUB_STEP_SUMMARY
            echo "**Resource Group:** ${{ needs.load-config.outputs.resource_group }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            az deployment group show \
              --resource-group ${{ needs.load-config.outputs.resource_group }} \
              --name "infra-dev-${{ github.run_number }}" \
              --query "properties.outputs" \
              --output table >> $GITHUB_STEP_SUMMARY

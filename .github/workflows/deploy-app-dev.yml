name: Build, Test & Deploy (Dev)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  workflow_run:
    workflows: ["Deploy Infrastructure (Dev)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  ENVIRONMENT: dev

jobs:
  # ──────────────────────────────────────────────
  # 1. Load environment config
  # ──────────────────────────────────────────────
  load-config:
    name: Load Config
    runs-on: ubuntu-latest
    # Skip if triggered by a failed infrastructure workflow
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      resource_group: ${{ steps.config.outputs.resource_group }}
      location: ${{ steps.config.outputs.location }}
    steps:
      - uses: actions/checkout@v5

      - name: Read environment config
        id: config
        run: |
          RESOURCE_GROUP=$(jq -r '.dev.resourceGroupName' infra/environments.json)
          LOCATION=$(jq -r '.dev.location' infra/environments.json)
          echo "resource_group=$RESOURCE_GROUP" >> $GITHUB_OUTPUT
          echo "location=$LOCATION" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────
  # 2a. Backend tests
  # ──────────────────────────────────────────────
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.results.outputs.passed }}
      failed: ${{ steps.results.outputs.failed }}
      skipped: ${{ steps.results.outputs.skipped }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        id: results
        run: |
          OUTPUT=$(python -m pytest tests/ -v --tb=short 2>&1) || true
          echo "$OUTPUT"
          SUMMARY=$(echo "$OUTPUT" | tail -5 | grep -oP '\d+ passed')
          PASSED=$(echo "$SUMMARY" | grep -oP '^\d+')
          SKIPPED=$(echo "$OUTPUT" | tail -5 | grep -oP '\d+ skipped' | grep -oP '^\d+' || echo "0")
          FAILED=$(echo "$OUTPUT" | tail -5 | grep -oP '\d+ failed' | grep -oP '^\d+' || echo "0")
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED:-0}" >> $GITHUB_OUTPUT
          # Fail the step if pytest failed
          echo "$OUTPUT" | tail -1 | grep -q "failed" && exit 1 || true

  # ──────────────────────────────────────────────
  # 2b. Frontend tests
  # ──────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.results.outputs.passed }}
      failed: ${{ steps.results.outputs.failed }}
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        id: results
        run: |
          OUTPUT=$(npm run test 2>&1) || true
          echo "$OUTPUT"
          # Extract only the summary line "N passed" from vitest output
          PASSED=$(echo "$OUTPUT" | grep -P '^\s+Tests\s' | grep -oP '\d+(?= passed)' | tail -1 || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -P '^\s+Tests\s' | grep -oP '\d+(?= failed)' | tail -1 || echo "0")
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT
          # Fail the step if vitest failed
          if [ "${FAILED:-0}" != "0" ]; then exit 1; fi

  # ──────────────────────────────────────────────
  # 2c. Update README test badges
  # ──────────────────────────────────────────────
  update-readme:
    name: Update README Badges
    needs: [test-backend, test-frontend]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Update test badges
        env:
          BE_PASSED: ${{ needs.test-backend.outputs.passed }}
          BE_FAILED: ${{ needs.test-backend.outputs.failed }}
          BE_SKIPPED: ${{ needs.test-backend.outputs.skipped }}
          FE_PASSED: ${{ needs.test-frontend.outputs.passed }}
          FE_FAILED: ${{ needs.test-frontend.outputs.failed }}
        run: |
          BE_PASSED=${BE_PASSED:-0}
          BE_FAILED=${BE_FAILED:-0}
          BE_SKIPPED=${BE_SKIPPED:-0}
          FE_PASSED=${FE_PASSED:-0}
          FE_FAILED=${FE_FAILED:-0}
          TOTAL=$((BE_PASSED + FE_PASSED))

          # Determine colours
          if [ "$BE_FAILED" = "0" ]; then BE_COLOR="brightgreen"; BE_STATUS="${BE_PASSED}_passing"; else BE_COLOR="red"; BE_STATUS="${BE_FAILED}_failing"; fi
          if [ "$FE_FAILED" = "0" ]; then FE_COLOR="brightgreen"; FE_STATUS="${FE_PASSED}_passing"; else FE_COLOR="red"; FE_STATUS="${FE_FAILED}_failing"; fi
          if [ "$BE_FAILED" = "0" ] && [ "$FE_FAILED" = "0" ]; then TOT_COLOR="brightgreen"; TOT_STATUS="${TOTAL}_passing"; else TOT_COLOR="red"; TOT_STATUS="failing"; fi

          # Replace badge lines in README
          sed -i "s|!\[Backend Tests\]([^)]*)|![Backend Tests](https://img.shields.io/badge/backend_tests-${BE_STATUS}-${BE_COLOR})|" README.md
          sed -i "s|!\[Frontend Tests\]([^)]*)|![Frontend Tests](https://img.shields.io/badge/frontend_tests-${FE_STATUS}-${FE_COLOR})|" README.md
          sed -i "s|!\[Total Tests\]([^)]*)|![Total Tests](https://img.shields.io/badge/total_tests-${TOT_STATUS}-${TOT_COLOR})|" README.md

      - name: Commit badge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "No badge changes" && exit 0
          git add README.md
          git commit -m "docs: update test badges [skip ci]"
          git push

  # ──────────────────────────────────────────────
  # 3. Build & push Docker images to ACR
  # ──────────────────────────────────────────────
  build:
    name: Build & Push Images
    needs: [load-config, test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.tags.outputs.backend_image }}
      frontend_image: ${{ steps.tags.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: |
          ACR_NAME=$(az acr list -g ${{ needs.load-config.outputs.resource_group }} --query "[0].name" -o tsv)
          ACR_SERVER=$(az acr show -n "$ACR_NAME" --query "loginServer" -o tsv)
          echo "name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "server=$ACR_SERVER" >> $GITHUB_OUTPUT

      - name: ACR Login
        run: az acr login -n ${{ steps.acr.outputs.name }}

      - name: Generate image tags
        id: tags
        run: |
          SHA="${GITHUB_SHA::8}"
          echo "backend_image=${{ steps.acr.outputs.server }}/travel-agent-backend:${SHA}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ steps.acr.outputs.server }}/travel-agent-frontend:${SHA}" >> $GITHUB_OUTPUT

      - name: Build & push backend image
        run: |
          docker build -t ${{ steps.tags.outputs.backend_image }} -f Dockerfile .
          docker push ${{ steps.tags.outputs.backend_image }}

      - name: Build & push frontend image
        run: |
          docker build -t ${{ steps.tags.outputs.frontend_image }} -f src/frontend/Dockerfile src/frontend/
          docker push ${{ steps.tags.outputs.frontend_image }}

  # ──────────────────────────────────────────────
  # 4. Deploy to Container Apps
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Dev
    needs: [load-config, build]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend container
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name travel-agent-dev-backend \
              --resource-group ${{ needs.load-config.outputs.resource_group }} \
              --image ${{ needs.build.outputs.backend_image }}

      - name: Get backend URL
        id: backend
        uses: azure/cli@v2
        with:
          inlineScript: |
            FQDN=$(az containerapp show \
              --name travel-agent-dev-backend \
              --resource-group ${{ needs.load-config.outputs.resource_group }} \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "url=https://${FQDN}" >> $GITHUB_OUTPUT

      - name: Deploy frontend container
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name travel-agent-dev-frontend \
              --resource-group ${{ needs.load-config.outputs.resource_group }} \
              --image ${{ needs.build.outputs.frontend_image }} \
              --set-env-vars "BACKEND_URL=${{ steps.backend.outputs.url }}"

      - name: Verify deployment
        uses: azure/cli@v2
        with:
          inlineScript: |
            FRONTEND_FQDN=$(az containerapp show \
              --name travel-agent-dev-frontend \
              --resource-group ${{ needs.load-config.outputs.resource_group }} \
              --query "properties.configuration.ingress.fqdn" -o tsv)

            echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| Frontend | https://${FRONTEND_FQDN} |" >> $GITHUB_STEP_SUMMARY
            echo "| Backend | ${{ steps.backend.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Backend Image | \`${{ needs.build.outputs.backend_image }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Frontend Image | \`${{ needs.build.outputs.frontend_image }}\` |" >> $GITHUB_STEP_SUMMARY
